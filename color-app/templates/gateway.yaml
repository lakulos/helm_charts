apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: traefik
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      hostname: {{ .hostname | quote }}
      port: {{ .port }}
    
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}